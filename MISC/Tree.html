<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Particle Christmas Tree</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
        #text-overlay {
            position: absolute;
            top: 15%;
            left: 8%;
            color: #ffb3c6;
            font-family: "Brush Script MT", cursive, sans-serif;
            font-size: 3.5rem;
            text-shadow: 0 0 15px rgba(255, 100, 130, 1);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="text-overlay">Merry Christmas</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 25, 60); 
        camera.lookAt(0, 20, 0); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 1. 核心修改：像“树”一样的生成算法 ---
        function createTree() {
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];

            // 树的基本参数
            const treeHeight = 55;
            const maxRadius = 22;
            const layers = 20; // 树分成多少层（层数越多越茂密）
            
            const colorTop = new THREE.Color(1.0, 0.2, 0.7); 
            const colorBottom = new THREE.Color(1.0, 0.5, 0.7); 

            // 循环每一层 (从下往上)
            for (let i = 0; i < layers; i++) {
                // layerRatio: 0 (底部) -> 1 (顶部)
                const layerRatio = i / layers; 
                
                // 当前层的高度
                const layerY = layerRatio * treeHeight;
                
                // 当前层的最大半径 (越往上越窄)
                const layerRadius = (1 - layerRatio) * maxRadius;

                // 这一层有多少个树枝？(底部多，顶部少)
                const branchCount = Math.floor(8 + (1 - layerRatio) * 15);

                // 循环这一层的每一个树枝
                for (let j = 0; j < branchCount; j++) {
                    // 树枝的角度 (均匀分布在圆周上，加一点随机偏移)
                    const angleBase = (j / branchCount) * Math.PI * 2;
                    const angle = angleBase + (Math.random() - 0.5) * 0.5;

                    // 每个树枝上有多少个粒子？(模拟针叶)
                    const particlesPerBranch = 30;

                    for (let k = 0; k < particlesPerBranch; k++) {
                        // kRatio: 0 (树干) -> 1 (树枝尖端)
                        const kRatio = k / particlesPerBranch;

                        // 半径向外延伸
                        const r = kRatio * layerRadius;

                        // --- 关键：模拟重力下垂 ---
                        // 树枝末端会稍微下垂 (抛物线效果)
                        const droop = kRatio * kRatio * 4; 
                        
                        // 基础坐标
                        let x = r * Math.cos(angle);
                        let y = layerY - droop; // 加上下垂
                        let z = r * Math.sin(angle);

                        // --- 关键：松针的蓬松感 ---
                        // 在骨架周围随机撒一点点点，让它看起来不是一条线，而是一簇
                        const spread = 0.8; // 松散程度
                        x += (Math.random() - 0.5) * spread;
                        y += (Math.random() - 0.5) * spread;
                        z += (Math.random() - 0.5) * spread;

                        // 避免树底下的粒子穿模到地底下
                        if (y < 0) y = 0;

                        positions.push(x, y + 2, z); // y+2 是为了把树稍微提起来一点

                        // 颜色混合
                        const mixColor = colorBottom.clone().lerp(colorTop, layerRatio);
                        // 树梢稍微亮一点
                        if (kRatio > 0.8) {
                            mixColor.offsetHSL(0, 0, 0.2);
                        }
                        colors.push(mixColor.r, mixColor.g, mixColor.b);
                    }
                }
            }

            // --- 添加一个顶部的“星光” ---
            // 简单用一团密集的粒子模拟
            for(let s=0; s<100; s++) {
                positions.push(
                    (Math.random()-0.5)*1.5, 
                    treeHeight + 2 + (Math.random()-0.5)*1.5, 
                    (Math.random()-0.5)*1.5
                );
                colors.push(1.0, 1.0, 1.0); // 纯白光
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.7,
                vertexColors: true,
                blending: THREE.AdditiveBlending, 
                transparent: true,
                opacity: 0.9,
                depthWrite: false
            });

            const tree = new THREE.Points(geometry, material);
            scene.add(tree);
            return tree;
        }

        // --- 2. 螺旋底座 (保持不变，因为效果很好) ---
        function createBaseParticles() {
            const particleCount = 8000;
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            const maxRadius = 60;
            const colorCenter = new THREE.Color(1.0, 0.4, 0.6);
            const colorEdge = new THREE.Color(0.3, 0.1, 0.2);

            for (let i = 0; i < particleCount; i++) {
                const ratio = i / particleCount;
                const r = ratio * maxRadius;
                const angle = ratio * Math.PI * 2 * 35; 
                const x = r * Math.cos(angle);
                const y = (Math.random() - 0.5) * 0.5; // 稍微压扁一点底座
                const z = r * Math.sin(angle);
                positions.push(x, y, z);
                const mixColor = colorCenter.clone().lerp(colorEdge, Math.pow(ratio, 1.5));
                colors.push(mixColor.r, mixColor.g, mixColor.b);
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            const material = new THREE.PointsMaterial({
                size: 0.6,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.6,
                depthWrite: false
            });
            const base = new THREE.Points(geometry, material);
            scene.add(base);
            return base;
        }

        // --- 3. 雪花 ---
        function createSnow() {
            const particleCount = 3000;
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const range = 200;
            for (let i = 0; i < particleCount; i++) {
                positions.push(
                    (Math.random() - 0.5) * range,
                    Math.random() * range,
                    (Math.random() - 0.5) * range
                );
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({
                color: 0xffeef5, 
                size: 0.6,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending
            });
            const snow = new THREE.Points(geometry, material);
            scene.add(snow);
            return snow;
        }

        const treeSystem = createTree();
        const baseSystem = createBaseParticles();
        const snowSystem = createSnow();

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 树身缓慢旋转
            treeSystem.rotation.y -= 0.003; 
            baseSystem.rotation.y -= 0.001;

            // 雪花下落
            const snowPositions = snowSystem.geometry.attributes.position.array;
            for(let i = 1; i < snowPositions.length; i+=3) {
                snowPositions[i] -= 0.2; 
                if (snowPositions[i] < 0) {
                    snowPositions[i] = 200;
                }
            }
            snowSystem.geometry.attributes.position.needsUpdate = true;
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        animate();
    </script>
</body>
</html>
